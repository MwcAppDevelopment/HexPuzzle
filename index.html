<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#c8cad0;user-select:none}canvas{display:block;cursor:crosshair}#ui{position:fixed;top:24px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10}#title{font-size:14px;letter-spacing:6px;text-transform:uppercase;color:#5a5e6a;margin-bottom:6px}#status{font-size:13px;color:#7a7e8a}#score-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:32px;z-index:10;pointer-events:none}.score-item{text-align:center}.score-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#3a3e4a;margin-bottom:2px}.score-value{font-size:22px;font-weight:300;color:#6af;font-variant-numeric:tabular-nums}#level-complete{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,18,0.85);z-index:20;opacity:0;pointer-events:none;transition:opacity 0.6s}#level-complete.show{opacity:1;pointer-events:all}#level-complete h2{font-size:28px;font-weight:300;letter-spacing:8px;text-transform:uppercase;color:#6af;margin-bottom:8px}#level-complete p{font-size:14px;color:#5a5e6a;margin-bottom:24px}#next-btn{padding:10px 36px;border:1px solid #3a4a6a;background:transparent;color:#6af;font-size:13px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all 0.3s}#next-btn:hover{background:#6af;color:#0a0a12}
</style>
</head>
<body>
<div id="ui"><div id="title">Hexline</div><div id="status">Click edges to solidify them</div></div>
<div id="score-bar"><div class="score-item"><div class="score-label">Level</div><div class="score-value" id="level-num">1</div></div><div class="score-item"><div class="score-label">Edges</div><div class="score-value" id="edges-count">0/0</div></div><div class="score-item"><div class="score-label">Hexes</div><div class="score-value" id="hexes-count">0/0</div></div></div>
<div id="level-complete"><h2>Complete</h2><p id="complete-msg">All hexagons solidified</p><button id="next-btn">Next Level</button></div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,cx,cy;function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;cx=W/2;cy=H/2}resize();window.addEventListener('resize',resize);const HS=40,S3=Math.sqrt(3);function hc(cx,cy,s,i){const a=Math.PI/180*(60*i-30);return[cx+s*Math.cos(a),cy+s*Math.sin(a)]}function hCtr(q,r){return[HS*(S3*q+S3/2*r),HS*(1.5*r)]}function sn(v){return[Math.round(v[0]*100)/100,Math.round(v[1]*100)/100]}function ek(a,b){const sa=sn(a),sb=sn(b),ka=sa[0]+','+sa[1],kb=sb[0]+','+sb[1];return ka<kb?ka+'|'+kb:kb+'|'+ka}function psd(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(!l2)return Math.hypot(px-ax,py-ay);let t=((px-ax)*dx+(py-ay)*dy)/l2;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}let E={},HC={},level=1,tT=0,sC=0,cH=0,tH=0,gW=false,gQ=[],gI=0,gTm=0;const GI=120,GD=3000;let P=[];function bL(l){E={};HC={};P=[];sC=0;cH=0;gW=false;const R=Math.min(1+l,5),co=[];for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++)if(Math.abs(q+r)<=R)co.push([q,r]);tH=co.length;co.forEach(([q,r])=>{const[hx,hy]=hCtr(q,r),cr=[];for(let i=0;i<6;i++)cr.push(hc(hx,hy,HS,i));const ck=q+','+r,cell={q,r,cx:hx,cy:hy,ek:[],done:false,fa:0};for(let i=0;i<6;i++){const a=cr[i],b=cr[(i+1)%6],k=ek(a,b);if(!E[k])E[k]={a,b,s:false,g:false,gs:0,pp:Math.random()*Math.PI*2,hk:[]};E[k].hk.push(ck);cell.ek.push(k)}HC[ck]=cell});tT=Object.keys(E).length;const ak=Object.keys(E);ak.sort((a,b)=>{const ea=E[a],eb=E[b];return Math.hypot((ea.a[0]+ea.b[0])/2,(ea.a[1]+ea.b[1])/2)-Math.hypot((eb.a[0]+eb.b[0])/2,(eb.a[1]+eb.b[1])/2)});gQ=ak;gI=0;gTm=0;uUI()}function uUI(){document.getElementById('level-num').textContent=level;document.getElementById('edges-count').textContent=sC+'/'+tT;document.getElementById('hexes-count').textContent=cH+'/'+tH}function cHx(ck){const c=HC[ck];if(c.done)return;if(c.ek.every(k=>E[k].s)){c.done=true;cH++;for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,sp=.5+Math.random()*1.5;P.push({x:c.cx,y:c.cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:.008+Math.random()*.012,sz:1.5+Math.random()*2})}}}function sol(k){const e=E[k];if(e.s)return;e.s=true;e.g=false;sC++;for(let i=0;i<6;i++){const t=Math.random(),px=e.a[0]+(e.b[0]-e.a[0])*t,py=e.a[1]+(e.b[1]-e.a[1])*t,a=Math.random()*Math.PI*2;P.push({x:px,y:py,vx:Math.cos(a)*.8,vy:Math.sin(a)*.8,l:1,d:.015+Math.random()*.02,sz:1+Math.random()*1.5})}e.hk.forEach(ck=>cHx(ck));uUI();if(sC>=tT){gW=true;setTimeout(()=>document.getElementById('level-complete').classList.add('show'),600)}}let hE=null;canvas.addEventListener('mousemove',ev=>{const wx=ev.clientX-cx,wy=ev.clientY-cy;let cl=null,cd=18;Object.keys(E).forEach(k=>{const e=E[k];if(e.s)return;const d=psd(wx,wy,e.a[0],e.a[1],e.b[0],e.b[1]);if(d<cd){cd=d;cl=k}});hE=cl;canvas.style.cursor=cl?'pointer':'crosshair'});canvas.addEventListener('click',ev=>{if(gW)return;const wx=ev.clientX-cx,wy=ev.clientY-cy;let cl=null,cd=18;Object.keys(E).forEach(k=>{const e=E[k];if(e.s)return;const d=psd(wx,wy,e.a[0],e.a[1],e.b[0],e.b[1]);if(d<cd){cd=d;cl=k}});if(cl)sol(cl)});document.getElementById('next-btn').addEventListener('click',()=>{document.getElementById('level-complete').classList.remove('show');level++;bL(level)});let lt=0;function draw(now){const dt=now-lt;lt=now;ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);Object.values(HC).forEach(c=>{ctx.beginPath();ctx.arc(c.cx,c.cy,1.5,0,Math.PI*2);ctx.fillStyle='rgba(40,42,54,0.6)';ctx.fill()});if(!gW){gTm+=dt;while(gTm>GI){gTm-=GI;const k=gQ[gI%gQ.length];if(!E[k].s){E[k].g=true;E[k].gs=now}gI++;if(gI>=gQ.length)gI=0}}const tm=now/1000;Object.keys(E).forEach(k=>{const e=E[k];if(e.s){ctx.beginPath();ctx.moveTo(e.a[0],e.a[1]);ctx.lineTo(e.b[0],e.b[1]);ctx.strokeStyle='#6af';ctx.lineWidth=2.5;ctx.stroke();ctx.beginPath();ctx.moveTo(e.a[0],e.a[1]);ctx.lineTo(e.b[0],e.b[1]);ctx.strokeStyle='rgba(102,170,255,0.15)';ctx.lineWidth=8;ctx.stroke()}else{ctx.beginPath();ctx.moveTo(e.a[0],e.a[1]);ctx.lineTo(e.b[0],e.b[1]);ctx.strokeStyle='rgba(50,55,70,0.4)';ctx.lineWidth=1;ctx.stroke();if(e.g){const el=now-e.gs;let I;if(el<400)I=el/400;else if(el<GD-600)I=.7+.3*Math.sin(tm*3+e.pp);else if(el<GD)I=(GD-el)/600;else{e.g=false;I=0}if(I>0){ctx.beginPath();ctx.moveTo(e.a[0],e.a[1]);ctx.lineTo(e.b[0],e.b[1]);ctx.strokeStyle='rgba(102,170,255,'+.12*I+')';ctx.lineWidth=12;ctx.stroke();ctx.beginPath();ctx.moveTo(e.a[0],e.a[1]);ctx.lineTo(e.b[0],e.b[1]);ctx.strokeStyle='rgba(130,190,255,'+.5*I+')';ctx.lineWidth=2;ctx.stroke()}}if(k===hE){ctx.beginPath();ctx.moveTo(e.a[0],e.a[1]);ctx.lineTo(e.b[0],e.b[1]);ctx.strokeStyle='rgba(102,170,255,0.6)';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(e.a[0],e.a[1]);ctx.lineTo(e.b[0],e.b[1]);ctx.strokeStyle='rgba(102,170,255,0.15)';ctx.lineWidth=10;ctx.stroke()}}});Object.values(HC).forEach(c=>{if(c.done){c.fa=Math.min(c.fa+.02,.12);const co=[];for(let i=0;i<6;i++)co.push(hc(c.cx,c.cy,HS-3,i));ctx.beginPath();ctx.moveTo(co[0][0],co[0][1]);for(let i=1;i<6;i++)ctx.lineTo(co[i][0],co[i][1]);ctx.closePath();ctx.fillStyle='rgba(102,170,255,'+c.fa+')';ctx.fill()}});for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.l-=p.d;if(p.l<=0){P.splice(i,1);continue}ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.l,0,Math.PI*2);ctx.fillStyle='rgba(130,200,255,'+p.l*.7+')';ctx.fill()}const dv=new Set();Object.values(E).forEach(e=>{[e.a,e.b].forEach(v=>{const vk=sn(v).join(',');if(dv.has(vk))return;dv.add(vk);const hs=Object.values(E).some(e2=>e2.s&&(sn(e2.a).join(',')==vk||sn(e2.b).join(',')==vk));ctx.beginPath();ctx.arc(v[0],v[1],hs?2.5:1.2,0,Math.PI*2);ctx.fillStyle=hs?'rgba(102,170,255,0.8)':'rgba(60,65,80,0.5)';ctx.fill()})});ctx.restore();requestAnimationFrame(draw)}bL(1);requestAnimationFrame(draw);
</script>
</body>
</html>
